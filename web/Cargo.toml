[package]
name = "web"
version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
homepage = { workspace = true }

[lib]
# This library is used exclusively in the browser as part of the cloud for on device encryption and decryption
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v2 = { package = "getrandom", version = "0.2", features = ["js"] }

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
chrono = { version = "0.4.45", features = ["wasm-bindgen"] }
ciborium = "0.2.2"
coset = "0.4.2"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
p256 = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
secretpass-core = { path = ".." }
tsify = "0.5.8"
wasm-bindgen = { version = "0.2.128" }
wasm-bindgen-futures = "0.4.78"


[dependencies.web-sys]
version = "0.3.105"
features = [
    "CredentialsContainer",
    "Credential",
    "Navigator",
    "Window",
    "CredentialRequestOptions",
    "CredentialCreationOptions",
    "PublicKeyCredential",
    "PublicKeyCredentialCreationOptions",
    "PublicKeyCredentialRpEntity",
    "PublicKeyCredentialUserEntity",
    "PublicKeyCredentialRequestOptions",
    "AuthenticatorAttestationResponse",
    "AuthenticatorAssertionResponse",
    "AuthenticationExtensionsClientOutputs",
    "AuthenticationExtensionsClientInputs",
    "AuthenticationExtensionsPrfInputs",
    "AuthenticationExtensionsPrfOutputs",
    "AuthenticationExtensionsPrfValues",
    "UserVerificationRequirement",
    "ResidentKeyRequirement",
    "AuthenticatorSelectionCriteria",
    "AttestationConveyancePreference",
    "AuthenticatorAttachment",
]

# Explicitly keep metadata during development builds to make debugging easier
[package.metadata.wasm-pack.profile.dev.wasm-bindgen]
dwarf-debug-info = true

[package.metadata.dist]
# Restrict this package to ONLY build for WASM
targets = ["wasm32-unknown-unknown"]