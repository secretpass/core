[package]
name = "secretpass-cli"
version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
homepage = { workspace = true }

[[bin]]
name = "spass"
path = "src/main.rs"

[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "B1BF63D8-5598-4B6A-B5EF-55CCCBBEAC79"
path-guid = "53E1D4CC-047F-4AE9-BB70-9413537C74E8"
license = false
eula = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
axum-embed = "0.1.0"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
home = "0.5.12"
nix = { version = "0.31.3", features = ["signal"] }
port_check = "0.3.0"
processkit = { version = "3.3.4", features = [] }
rust-embed = "8.13.0"
secretpass-core = { path = ".." }
serde = { version = "1.0.229" }
yaml_serde = "0.10.7"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
webbrowser = "1.2.4"
uuid = { version = "1.28.0", features = ["v4"] }
