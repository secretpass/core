[package]
name = "secretpass-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
home = "0.5.12"
nix = { version = "0.31.3", features = ["signal"] }
processkit = { version = "3.3.4", features = [] }
secretpass-core = { path = ".." }
serde = { version = "1.0.229" }
yaml_serde = "0.10.7"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
webbrowser = "1.2.4"
uuid = { version = "1.28.0", features = ["v4"] }
