[package]
name = "secretpass-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9" }
clap = { version = "4.6.6", features = ["derive"] }
home = "0.5.12"
secretpass-core = { path = ".." }
