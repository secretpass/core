- name: Export Rust Flags
  if: ${{ matrix.container.image != 'messense/cargo-xwin' && matrix.host != 'x86_64-pc-windows-msvc' }}
  run: |
    echo "RUSTFLAGS=--cfg web_sys_unstable_apis" >> $GITHUB_ENV

- name: Export Rust Flags Win ARM
  if: ${{ matrix.container.image == 'messense/cargo-xwin' }}
  run: |
    echo "RUSTFLAGS=--cfg web_sys_unstable_apis -C linker-flavor=wasm-lld" >> $GITHUB_ENV


- name: Export Rust Flags on Win X86
  if: ${{ matrix.host == 'x86_64-pc-windows-msvc' }}
  run: |
    echo "RUSTFLAGS=--cfg=web_sys_unstable_apis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

- name: Setup Bun
  uses: oven-sh/setup-bun@v2
  with:
    bun-version: latest

- name: Install wasm-bindgen-cli
  run: cargo install -f wasm-bindgen-cli
