- name: Export Rust Flags
  run: |
    echo "RUSTFLAGS=--cfg web_sys_unstable_apis" >> $GITHUB_ENV

- name: Export Rust Flags on Windows
  run: |
    (echo "RUSTFLAGS=--cfg=web_sys_unstable_apis --linker-flavor=wasm-lld" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append) || echo ""

- name: Setup Bun
  uses: oven-sh/setup-bun@v2
  with:
    bun-version: latest

- name: Install wasm-bindgen-cli
  run: cargo install -f wasm-bindgen-cli
