[workspace]
members = [
    "cli",
    "web",
]
resolver = "2"

[workspace.package]
version = "0.1.0-prerelease-1"
edition = "2024"
repository = "https://github.com/secretpass/core"
authors = ["Secretpass Inc", "Billcountry Mwaniki"]
description = "Secretpass cli allows you to manage secrets locally secured through passkeys for human access and generated private keys for machine access"
homepage = "https://secretpass.cloud"

[package]
name = "secretpass-core"
version = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
homepage = { workspace = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[dependencies]
aes-gcm = { version = "0.11.1", features = ["getrandom"] }
anyhow = "1.0.104"
argon2 = { version = "0.6.0" }
base64 = "0.23.1"
ciborium = { version = "0.2.2" }
hex = "0.4.3"
fips203 = { version = "0.4.3", features = ["ml-kem-768"] }
rand = { version = "0.10.2", default-features = false, features = ["chacha"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.0" }
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
tsify = { version = "0.5.8", features = ["wasm-bindgen"] }
wasm-bindgen = { version = "0.2.128" }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
dist = false

