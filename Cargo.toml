[workspace]
members = [
    "cli",
    "web",
]
resolver = "2"

[package]
name = "secretpass-core"
version = "0.1.0-prerelease-1"
edition = "2024"

[lib]
# This library is used in cli and also as part of the cloud for on device encryption and decryption
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.11.1", features = ["getrandom"] }
anyhow = "1.0.104"
argon2 = { version = "0.6.0" }
base64 = "0.23.1"
ciborium = { version = "0.2.2" }
hex = "0.4.3"
fips203 = { version = "0.4.3", features = ["ml-kem-768"] }
rand = { version = "0.10.2", default-features = false, features = ["chacha"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.0" }
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
tsify = { version = "0.5.8", features = ["wasm-bindgen"] }
wasm-bindgen = { version = "0.2.128" }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
